<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 640" width="1440" height="640" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif">
  <title>Galley editor — Phase 2 target: type mode, threading and styles</title>

  <rect x="0" y="0" width="1440" height="640" fill="#1d1d1f"/>

  <!-- control strip in character mode -->
  <rect x="0" y="0" width="1440" height="48" fill="#323234"/>
  <line x1="0" y1="47.5" x2="1440" y2="47.5" stroke="#1d1d1f"/>
  <!-- A / ¶ mode toggle -->
  <rect x="12" y="8" width="22" height="15" rx="2" fill="#4a4a4e"/>
  <text x="23" y="19.5" font-size="11" font-weight="700" fill="#f2f2f6" text-anchor="middle">A</text>
  <rect x="12" y="26" width="22" height="15" rx="2" fill="none" stroke="#4a4a4e"/>
  <text x="23" y="37.5" font-size="11" fill="#c8c8cc" text-anchor="middle">¶</text>
  <!-- font family / style -->
  <g fill="#1f1f21" stroke="#4a4a4e">
    <rect x="46" y="7" width="170" height="16" rx="3"/>
    <rect x="46" y="26" width="170" height="16" rx="3"/>
  </g>
  <g font-size="11" fill="#ececf0">
    <text x="52" y="19">Inter</text>
    <text x="52" y="38">Regular</text>
  </g>
  <g fill="none" stroke="#9a9a9e" stroke-width="1.2">
    <path d="M202 13 l4 4 l4 -4"/><path d="M202 32 l4 4 l4 -4"/>
  </g>
  <!-- size / leading -->
  <text x="230" y="19" font-size="10" fill="#c8c8cc">T↕</text>
  <text x="230" y="38" font-size="10" fill="#c8c8cc">A↕</text>
  <g fill="#1f1f21" stroke="#4a4a4e">
    <rect x="252" y="7" width="66" height="16" rx="3"/>
    <rect x="252" y="26" width="66" height="16" rx="3"/>
  </g>
  <g font-size="11" fill="#ececf0">
    <text x="258" y="19">10 pt</text>
    <text x="258" y="38">13.5 pt</text>
  </g>
  <!-- tracking / kerning -->
  <text x="332" y="19" font-size="10" fill="#c8c8cc">VA</text>
  <text x="332" y="38" font-size="10" fill="#c8c8cc">V/A</text>
  <g fill="#1f1f21" stroke="#4a4a4e">
    <rect x="356" y="7" width="74" height="16" rx="3"/>
    <rect x="356" y="26" width="74" height="16" rx="3"/>
  </g>
  <g font-size="11" fill="#ececf0">
    <text x="362" y="19">0</text>
    <text x="362" y="38">Metrics</text>
  </g>
  <!-- case / OpenType -->
  <line x1="444" y1="6" x2="444" y2="42" stroke="#4a4a4e"/>
  <g font-size="11" fill="#c8c8cc">
    <text x="456" y="19" font-weight="700">TT</text><text x="480" y="19" font-weight="700" font-size="9">TT</text>
    <text x="502" y="19">T¹</text><text x="522" y="19">T₁</text>
    <text x="456" y="38">fi</text><text x="476" y="38" font-style="italic">ƒ</text><text x="494" y="38">⅓</text><text x="514" y="38">O ▾</text>
  </g>
  <!-- paragraph: alignment -->
  <line x1="546" y1="6" x2="546" y2="42" stroke="#4a4a4e"/>
  <g stroke="#c8c8cc" stroke-width="1.4">
    <rect x="556" y="8" width="22" height="16" rx="2" fill="#4a4a4e" stroke="none"/>
    <line x1="560" y1="12" x2="574" y2="12"/><line x1="560" y1="16" x2="570" y2="16"/><line x1="560" y1="20" x2="574" y2="20"/>
    <line x1="586" y1="12" x2="600" y2="12"/><line x1="588" y1="16" x2="598" y2="16"/><line x1="586" y1="20" x2="600" y2="20"/>
    <line x1="610" y1="12" x2="624" y2="12"/><line x1="614" y1="16" x2="624" y2="16"/><line x1="610" y1="20" x2="624" y2="20"/>
    <line x1="634" y1="12" x2="648" y2="12"/><line x1="634" y1="16" x2="648" y2="16"/><line x1="634" y1="20" x2="642" y2="20"/>
  </g>
  <!-- indents / space -->
  <g font-size="10" fill="#c8c8cc">
    <text x="560" y="38">→|</text><text x="634" y="38">↧</text>
  </g>
  <g fill="#1f1f21" stroke="#4a4a4e">
    <rect x="578" y="27" width="48" height="15" rx="3"/>
    <rect x="648" y="27" width="48" height="15" rx="3"/>
  </g>
  <g font-size="10.5" fill="#ececf0">
    <text x="583" y="38">12 pt</text><text x="653" y="38">0 pt</text>
  </g>
  <!-- paragraph style + hyphenate + baseline grid -->
  <line x1="710" y1="6" x2="710" y2="42" stroke="#4a4a4e"/>
  <text x="722" y="19" font-size="11" fill="#c8c8cc">Paragraph style</text>
  <rect x="826" y="7" width="140" height="16" rx="3" fill="#1f1f21" stroke="#4a4a4e"/>
  <text x="832" y="19" font-size="11" fill="#ececf0">Body+</text>
  <path d="M952 13 l4 4 l4 -4" fill="none" stroke="#9a9a9e" stroke-width="1.2"/>
  <rect x="722" y="29" width="11" height="11" rx="2" fill="#4da3ff"/>
  <path d="M724.5 34.5 l2.5 2.5 l4 -5" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="740" y="38.5" font-size="11" fill="#c8c8cc">Hyphenate</text>
  <rect x="808" y="29" width="11" height="11" rx="2" fill="none" stroke="#6c6c70"/>
  <text x="826" y="38.5" font-size="11" fill="#c8c8cc">Align to baseline grid</text>

  <!-- pasteboard -->
  <rect x="0" y="48" width="1100" height="592" fill="#3b3b3e"/>
  <!-- page fragment -->
  <rect x="60" y="76" width="980" height="564" fill="#ffffff"/>
  <!-- baseline grid hint -->
  <g stroke="#9fd3ff" stroke-width="0.6" opacity="0.55">
    <line x1="60" y1="140" x2="1040" y2="140"/><line x1="60" y1="158" x2="1040" y2="158"/><line x1="60" y1="176" x2="1040" y2="176"/>
    <line x1="60" y1="194" x2="1040" y2="194"/><line x1="60" y1="212" x2="1040" y2="212"/><line x1="60" y1="230" x2="1040" y2="230"/>
  </g>

  <!-- frame A -->
  <rect x="110" y="110" width="360" height="420" fill="none" stroke="#4da3ff" stroke-width="1.2"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#231f20">
    <text x="122" y="140" font-size="21" font-weight="800">Process notes</text>
    <g font-size="12.5">
      <text x="122" y="176">Every print in the show starts as a stack of</text>
      <text x="122" y="194">separations. The studio mixes its own inks,</text>
      <text x="122" y="212">so the orange on the poster is the same orange</text>
      <text x="122" y="230">on the shop door. Registration is checked by</text>
      <text x="122" y="248">eye and by loupe before the first pull.</text>
      <text x="138" y="276">Visitors can try a two-color pull at the</text>
      <text x="122" y="294">letterpress, ink a block, and take home the</text>
      <text x="122" y="312">sheet. Screens are reclaimed between demos,</text>
      <text x="122" y="330">and the riso runs a short edition of postcards</text>
      <text x="122" y="348">that change every hour of the day. Bring a</text>
      <text x="122" y="366">tote; the paper goes fast. Prints are signed and</text>
      <text x="122" y="384">numbered, and the proceeds fund the next show.</text>
      <text x="138" y="412">The studios are wheelchair accessible and the</text>
      <text x="122" y="430">courtyard has shade, water and seating. Guided</text>
      <text x="122" y="448">tours leave the front desk on the hour, starting</text>
      <text x="122" y="466">at ten. Each tour visits four studios and ends at</text>
      <text x="122" y="484">the drying racks, where the morning's prints are</text>
      <text x="122" y="502">hung to cure before they go on sale in the after-</text>
    </g>
  </g>
  <!-- text caret -->
  <line x1="318" y1="300" x2="318" y2="316" stroke="#231f20" stroke-width="1.2"/>
  <!-- ports on frame A -->
  <rect x="104" y="124" width="12" height="12" fill="#ffffff" stroke="#4da3ff"/>
  <rect x="464" y="512" width="12" height="12" fill="#ffffff" stroke="#4da3ff"/>
  <path d="M467 514 l6 4 l-6 4 z" fill="#4da3ff"/>

  <!-- thread line -->
  <path d="M476 518 C560 518 470 140 556 128" fill="none" stroke="#4da3ff" stroke-width="1.5"/>

  <!-- frame B -->
  <rect x="560" y="110" width="420" height="250" fill="none" stroke="#4da3ff" stroke-width="1.2"/>
  <rect x="554" y="122" width="12" height="12" fill="#ffffff" stroke="#4da3ff"/>
  <path d="M557 124 l6 4 l-6 4 z" fill="#4da3ff"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif" fill="#231f20" font-size="12.5">
    <text x="572" y="140">noon. Food trucks park on Grove Street from eleven</text>
    <text x="572" y="158">until the last print sells, and the coffee cart opens</text>
    <text x="572" y="176">at nine for early visitors.</text>
    <text x="588" y="204">Workshop sign-ups open on the studio website the</text>
    <text x="572" y="222">week before. Spaces are limited to eight people per</text>
    <text x="572" y="240">session so everyone gets time on the press. Aprons,</text>
    <text x="572" y="258">gloves and paper are provided, and every participant</text>
    <text x="572" y="276">leaves with a finished print and a sheet of notes on</text>
    <text x="572" y="294">the process. Children under twelve are welcome with</text>
    <text x="572" y="312">an adult. The studios close for cleanup at four, and</text>
    <text x="572" y="330">the courtyard stays open until the light goes. Thank</text>
    <text x="572" y="348">you to the printers, volunteers and neighbours who</text>
  </g>
  <!-- overset marker -->
  <rect x="974" y="354" width="12" height="12" fill="#ffffff" stroke="#e5352b" stroke-width="1.2"/>
  <line x1="976.5" y1="360" x2="983.5" y2="360" stroke="#e5352b" stroke-width="1.6"/>
  <line x1="980" y1="356.5" x2="980" y2="363.5" stroke="#e5352b" stroke-width="1.6"/>

  <!-- text-wrap object -->
  <ellipse cx="770" cy="480" rx="84" ry="84" fill="#e4002b"/>
  <ellipse cx="770" cy="480" rx="96" ry="96" fill="none" stroke="#4da3ff" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="770" y="488" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">FREE</text>

  <!-- callouts -->
  <g font-size="11" fill="#e8e8ec">
    <rect x="490" y="560" width="126" height="22" rx="4" fill="#2a2a2c"/>
    <text x="500" y="575">Thread: frame 1 → 2</text>
    <line x1="553" y1="560" x2="520" y2="330" stroke="#8a8a8e" stroke-dasharray="3 3"/>
    <rect x="890" y="390" width="140" height="22" rx="4" fill="#2a2a2c"/>
    <text x="900" y="405">Overset: 64 words</text>
    <line x1="960" y1="390" x2="978" y2="368" stroke="#8a8a8e" stroke-dasharray="3 3"/>
    <rect x="300" y="560" width="174" height="22" rx="4" fill="#2a2a2c"/>
    <text x="310" y="575">Hyphen split across frames</text>
    <line x1="420" y1="560" x2="452" y2="508" stroke="#8a8a8e" stroke-dasharray="3 3"/>
    <rect x="890" y="590" width="140" height="22" rx="4" fill="#2a2a2c"/>
    <text x="900" y="605">Wrap: ellipse, 12 pt</text>
    <line x1="920" y1="590" x2="840" y2="540" stroke="#8a8a8e" stroke-dasharray="3 3"/>
  </g>

  <!-- right dock: paragraph styles -->
  <rect x="1100" y="48" width="340" height="592" fill="#2a2a2c"/>
  <line x1="1100.5" y1="48" x2="1100.5" y2="640" stroke="#1d1d1f"/>
  <rect x="1100" y="48" width="340" height="26" fill="#323234"/>
  <rect x="1100" y="48" width="128" height="26" fill="#2a2a2c"/>
  <text x="1112" y="65" font-size="11" font-weight="600" fill="#ececf0">Paragraph Styles</text>
  <text x="1240" y="65" font-size="11" fill="#9a9a9e">Character Styles</text>
  <text x="1428" y="65" font-size="11" fill="#8a8a8e" text-anchor="end">≡</text>
  <g font-size="11.5" fill="#d8d8dc">
    <text x="1112" y="98">[Basic Paragraph]</text>
    <text x="1112" y="122">Headline</text>
    <text x="1112" y="146">Subhead</text>
    <text x="1112" y="170">Body First</text>
    <rect x="1100" y="180" width="340" height="24" fill="#3d5a80"/>
    <text x="1112" y="196" fill="#ffffff">Body +</text>
    <text x="1112" y="220">Caption</text>
    <text x="1112" y="244">Pull Quote</text>
  </g>
  <text x="1428" y="196" font-size="10" fill="#c8d8f0" text-anchor="end">based on Body First</text>
  <line x1="1100" y1="258" x2="1440" y2="258" stroke="#1d1d1f"/>
  <g fill="none" stroke="#9a9a9e" stroke-width="1.2">
    <path d="M1360 266 h12 v12 h-12 z M1366 269 v6 M1363 272 h6"/>
    <path d="M1384 266 h10 M1386 266 v12 h6 v-12 M1388 264 h2"/>
    <path d="M1404 268 a5 5 0 1 0 5 -2 M1409 264 v3 h-3"/>
  </g>
  <text x="1112" y="276" font-size="10" fill="#8a8a8e">Clear overrides ⌥-click</text>

  <!-- style layers card -->
  <text x="1112" y="306" font-size="11" font-weight="600" fill="#ececf0">Body: style layers</text>
  <g font-size="10.5">
    <rect x="1112" y="316" width="316" height="62" rx="4" fill="#232325" stroke="#3a3a3e"/>
    <text x="1122" y="334" fill="#9fd3ff" font-weight="600">Shared</text>
    <text x="1122" y="351" fill="#c8c8cc">Inter Regular · [Black] · tracking 0</text>
    <text x="1122" y="367" fill="#c8c8cc">Role: body · hyphenation: auto</text>
    <rect x="1112" y="386" width="316" height="78" rx="4" fill="#232325" stroke="#3a3a3e"/>
    <text x="1122" y="404" fill="#ffb27a" font-weight="600">Print</text>
    <text x="1122" y="421" fill="#c8c8cc">10 / 13.5 pt · first-line indent 12 pt</text>
    <text x="1122" y="437" fill="#c8c8cc">space after 0 · align to baseline grid: off</text>
    <text x="1122" y="453" fill="#c8c8cc">keep: 2 lines together (Phase 2 stretch)</text>
    <rect x="1112" y="472" width="316" height="62" rx="4" fill="#232325" stroke="#3a3a3e" stroke-dasharray="4 3"/>
    <text x="1122" y="490" fill="#a6e3a1" font-weight="600">Web</text>
    <text x="1122" y="507" fill="#8a8a8e">Stored, edited in Phase 6</text>
    <text x="1122" y="523" fill="#8a8a8e">1rem / 1.5 · &lt;p&gt;</text>
  </g>
  <text x="1112" y="566" font-size="10" fill="#8a8a8e">Fonts: 312 families · 2 used · 0 missing</text>
  <text x="1112" y="584" font-size="10" fill="#e8a33d">⚠ Adobe Garamond Pro (.otf) exports as Type 3</text>
</svg>
